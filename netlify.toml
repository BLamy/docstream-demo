[build]
  command = "npm run build"
  publish = "dist/apps/blamy-notes"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[[redirects]]
  from = "/github.com"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/github.com/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/docs"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/billing/*"
  to = "/index.html"
  status = 200
